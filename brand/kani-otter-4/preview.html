<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kani Otter 4 logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&display=swap">
<style>
  body { margin: 0; font-family: 'Google Sans', system-ui, sans-serif; display: grid; grid-template-columns: 1fr 1fr; }
  section { padding: 40px; display: flex; flex-direction: column; gap: 28px; }
  .dark { background: #0f1012; color: #ececee; }
  .light { background: #ffffff; color: #1b1c1f; }
  .sizes { display: flex; align-items: end; gap: 24px; }
  .lockup { display: flex; align-items: center; gap: 22px; }
  .lockup img { width: 112px; height: 112px; }
  .lockup span { font-size: 64px; font-weight: 600; letter-spacing: -1.5px; }
  .lockup b { color: #bce5d1; font-weight: 600; }
  .light .lockup b { color: #1d6a4b; }
</style>
</head>
<body>
  <section class="dark">
    <div class="sizes"><img src="kani-otter-4.svg" width="256" height="256" alt=""><img src="kani-otter-4.svg" width="64" height="64" alt=""><img src="kani-otter-4.svg" width="32" height="32" alt=""><img src="kani-otter-4.svg" width="16" height="16" alt=""></div>
    <div class="lockup"><img src="kani-otter-4.svg" alt=""><span>Kani Otter <b>4</b></span></div>
  </section>
  <section class="light">
    <div class="sizes"><img src="kani-otter-4.svg" width="256" height="256" alt=""><img src="kani-otter-4.svg" width="64" height="64" alt=""><img src="kani-otter-4.svg" width="32" height="32" alt=""><img src="kani-otter-4.svg" width="16" height="16" alt=""></div>
    <div class="lockup"><img src="kani-otter-4.svg" alt=""><span>Kani Otter <b>4</b></span></div>
  </section>
</body>
</html>
